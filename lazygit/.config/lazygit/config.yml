git:
  pagers:
    - pager: "delta --dark --paging=never --minus-style 'syntax #4f2d3d' --minus-emph-style 'syntax #863852' --plus-style 'syntax #3d4f3d' --plus-emph-style 'syntax #4d6050' --line-numbers-minus-style '#f38ba8' --line-numbers-plus-style '#a6e3a1'"

gui:
  theme:
    activeBorderColor:
      - "#eba0ac"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    cherryPickedCommitBgColor:
      - "#45475a"
    cherryPickedCommitFgColor:
      - "#eba0ac"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
    searchingActiveBorderColor:
      - "#f9e2af"

  authorColors:
    "*": "#b4befe"
